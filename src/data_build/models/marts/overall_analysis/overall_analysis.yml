version: 2

models:
  - name: mart_overall_analysis
    description: "Overall Analysis Modelling table."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - location
            - experiment_name
            - name1
            - plot
    columns:
      - name: o_a_score
        tests:
          - not_null

      - name: env_type
        tests:
          - not_null
          - accepted_values:
              values: ["MED", "NE"]