version: 2

models:
  - name: overall_analysis
    description: >
      Overall Analysis Modelling table
    columns:
      - name: name1
        data_tests: [not_null]   
      - name: year
        data_tests: [not_null]
      - name: o_a_score
        data_tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, max_value: 9}
      - name: env_enc
        data_tests:
          - accepted_values: {values: [0, 1]}
      - name: env_type
        data_tests:
          - accepted_values: {values: ['NE', 'MED']}