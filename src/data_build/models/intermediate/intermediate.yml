versions: 2

models: 
  - name: int_trials_current
    description: "Current snapshot of valid trials (SCD2 valid_to is NULL)."
    
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - location
            - experiment_name
            - name1
            - plot

    columns:
      - name: year
        data_tests: [not_null]

      - name: name1
        data_tests: [not_null]

      - name: experiment_name
        tests: [not_null]

      - name: plot 
        tests: [not_null]

      - name: location 
        tests: [not_null]

      - name: business_key 
        tests: [not_null]

      - name: env_type
        tests:
          - not_null
          - accepted_values:
              values: ["MED", "NE", "UNKNOWN"]

      - name: trial_type
        tests:
          - not_null
          - accepted_values:
              values: ["PROCESS", "WARE", "UNKNOWN"]

      - name: soil_type
        tests:
          - not_null
          - accepted_values:
              values: ["SAND", "CLAY", "UNKNOWN"]
      
      - name: o_a_score
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 9

      - name: appearance
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 9
      
      - name: tubersize
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 9
      
      - name: eveness
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 9

      - name: tubnumbers
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 9

      - name: eyedepth
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 9

      - name: uniformity
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 9

      - name: ffscab
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 9

      - name: ffdefects
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 9
      
      - name: ffhollowh
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 9

      - name: ff_irs
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 9

      - name: yield
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 250